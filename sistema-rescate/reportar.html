<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para reportar animales que necesitan rescate">
    <title>Reportar | Sistema de Rescate y Adopción</title>
</head>
<body>
    <header>
        <h1>Reporte de Animales</h1>
        <p>Formulario para registrar animales que necesitan rescate.</p>
    </header>

    <nav aria-label="Navegación principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar un animal</a></li>
            <li><a href="rescates.html">Registro de rescates</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Registrar un nuevo reporte</h2>
            <form action="#" method="get">
                <fieldset>
                    <legend>Información del reportante</legend>
                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" maxlength="100" autocomplete="name" required>
                    </p>
                    <p>
                        <label for="cedula">Número de identificación:</label>
                        <input type="text" id="cedula" name="cedula" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="Ingrese 10 dígitos numéricos" required>
                    </p>
                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" inputmode="tel" pattern="[0-9]{10}" maxlength="10" title="Ingrese 10 dígitos numéricos" required>
                    </p>
                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" autocomplete="email" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Información del animal</legend>
                    <p>
                        <label for="animal">Tipo de animal:</label>
                        <select id="animal" name="animal" required>
                            <option value="">Seleccione una opción</option>
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>
                    <p>
                        <label for="cantidad">Cantidad de animales:</label>
                        <input type="number" id="cantidad" name="cantidad" min="1" max="50" required>
                    </p>
                    <p>
                        <label for="fecha">Fecha del reporte:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>
                    <p>
                        <label for="ubicacion">Ubicación del animal:</label>
                        <input type="text" id="ubicacion" name="ubicacion" minlength="5" maxlength="200" required>
                    </p>
                    <p>
                        <label for="estado">Estado del animal:</label>
                        <select id="estado" name="estado" required>
                            <option value="">Seleccione una opción</option>
                            <option value="abandonado">Abandonado</option>
                            <option value="herido">Herido</option>
                            <option value="maltratado">Maltratado</option>
                            <option value="perdido">Perdido</option>
                        </select>
                    </p>
                    <p>
                        <label for="descripcion">Descripción del caso:</label>
                        <textarea id="descripcion" name="descripcion" rows="5" minlength="10" maxlength="1000" required></textarea>
                    </p>
                </fieldset>

                <button type="submit">Enviar reporte</button>
                <button type="reset">Limpiar formulario</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Control de Rescate y Adopción.</p>
        <p><a href="index.html">Volver al inicio</a></p>
    </footer>
</body>
</html>
